name: DevSecOps CI/CD Pipeline for Hotel-Booking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # Needed for SARIF upload

jobs:
  security_scan:
    name: 🔒 Security Scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './'  # Scan the entire project directory
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  docker_build:
    name: 🛥 Docker Build & Push
    runs-on: ubuntu-latest
    needs: security_scan  # Ensure security scan completes before building Docker image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .  # Build Docker image from the root of the repository
          push: true
          tags: stutigambhir/hotel-booking:latest  # Replace with your DockerHub image name

  deploy:
    name: 🚀 Deploy Ansible to EC2
    runs-on: ubuntu-latest
    needs: docker_build  # Ensure Docker build is successful before deploying
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH into EC2 and pull the Docker image
        run: |
          ssh -i stuti-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} "
          docker pull stutigambhir/hotel-booking:latest &&
          docker run -d --name hotel-booking-container stutigambhir/hotel-booking:latest
          "
        continue-on-error: true
